
name: Gist CRUD - Python Client PoC

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to perform"
        required: true
        type: choice
        options:
          - create
          - read
          - update
          - delete

      gist_id:
        description: "Existing Gist ID (required for read, update and delete)"
        required: false
        type: string

      visibility:
        description: "Visibility for new Gists"
        required: true
        type: choice
        default: secret
        options:
          - secret
          - public

      confirm_delete:
        description: "Confirm Gist deletion"
        required: true
        type: choice
        default: "no"
        options:
          - "no"
          - "yes"

jobs:
  gist-crud:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      PYTHONPATH: ${{ github.workspace }}/.github/scripts
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      OPERATION: ${{ inputs.operation }}
      GIST_ID: ${{ inputs.gist_id }}
      VISIBILITY: ${{ inputs.visibility }}
      CONFIRM_DELETE: ${{ inputs.confirm_delete }}
      SOURCE_DIR: test-gist-folder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute Gist operation
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import os
          import sys
          from pathlib import Path

          from gist_client import (
              GitHubGistClient,
              GitHubGistError
          )

          operation = os.environ["OPERATION"]
          gist_id = os.environ.get("GIST_ID", "").strip()
          visibility = os.environ["VISIBILITY"]
          confirm_delete = os.environ["CONFIRM_DELETE"]

          source_dir = Path(os.environ["SOURCE_DIR"])

          # Validate inputs
          if not os.environ.get("GIST_TOKEN"):
              raise SystemExit("GIST_TOKEN secret is missing.")

          if operation in ("read", "update", "delete") and not gist_id:
              raise SystemExit(
                  f"A Gist ID is required for '{operation}'."
              )

          if operation == "delete" and confirm_delete != "yes":
              raise SystemExit("Deletion not confirmed.")

          if operation in ("create", "update"):
              if not source_dir.is_dir():
                  raise SystemExit(
                      f"Source directory not found: {source_dir}"
                  )

              files = {
                  path.name: path.read_text(encoding="utf-8")
                  for path in source_dir.iterdir()
                  if path.is_file()
              }

              if not files:
                  raise SystemExit(
                      f"No files found in {source_dir}."
                  )
          else:
              files = {}

          client = GitHubGistClient()

          try:

              # CREATE
              if operation == "create":
                  print("Creating Gist...")

                  gist = client.create_gist(
                      description="Gist CRUD PoC - test-gist-folder",
                      files=files,
                      public=(visibility == "public")
                  )

                  gist_id = gist["id"]
                  gist_url = gist["html_url"]

                  print(f"Created Gist: {gist_url}")

                  with open(
                      os.environ["GITHUB_STEP_SUMMARY"], "a"
                  ) as summary:
                      summary.write(
                          "## Gist created\n\n"
                          f"- **ID:** `{gist_id}`\n"
                          f"- **URL:** {gist_url}\n"
                          f"- **Visibility:** {visibility}\n"
                          f"- **Files:** {', '.join(files.keys())}\n"
                      )

              # READ
              elif operation == "read":
                  print(f"Reading Gist {gist_id}...")

                  gist = client.get_gist(gist_id)

                  print(f"Description: {gist['description']}")
                  print(f"URL: {gist['html_url']}")
                  print(f"Public: {gist['public']}")

                  remote_files = gist.get("files", {})

                  with open(
                      os.environ["GITHUB_STEP_SUMMARY"], "a"
                  ) as summary:
                      summary.write(
                          "## Gist contents\n\n"
                          f"- **ID:** `{gist_id}`\n"
                          f"- **URL:** {gist['html_url']}\n"
                          f"- **Public:** {gist['public']}\n\n"
                          "### Files\n\n"
                      )

                      for filename, file_info in remote_files.items():
                          content = file_info.get("content")

                          print(f"\n===== {filename} =====")
                          print(
                              content if content is not None
                              else "[Content unavailable or truncated]"
                          )

                          summary.write(f"- `{filename}`\n")

              # UPDATE
              elif operation == "update":
                  print(f"Synchronizing Gist {gist_id}...")

                  remote = client.get_gist(gist_id)
                  remote_files = remote.get("files", {})

                  # Determine additions, modifications and deletions.
                  add_files = {
                      name: content
                      for name, content in files.items()
                      if name not in remote_files
                  }

                  edit_files = {}

                  for name, content in files.items():
                      if name in remote_files:
                          remote_content = remote_files[name].get("content")

                          if remote_content is None:
                              raise SystemExit(
                                  f"Cannot compare '{name}': "
                                  "remote content is unavailable."
                              )

                          if content != remote_content:
                              edit_files[name] = content

                  delete_files = [
                      name
                      for name in remote_files
                      if name not in files
                  ]

                  print(f"Files to add: {list(add_files)}")
                  print(f"Files to edit: {list(edit_files)}")
                  print(f"Files to delete: {delete_files}")

                  if not (add_files or edit_files or delete_files):
                      print("No changes detected.")

                      with open(
                          os.environ["GITHUB_STEP_SUMMARY"], "a"
                      ) as summary:
                          summary.write(
                              "## Gist synchronization\n\n"
                              "No changes detected. Nothing uploaded.\n"
                          )

                  else:
                      updated = client.update_gist(
                          gist_id=gist_id,
                          add_files=add_files,
                          edit_files=edit_files,
                          delete_files=delete_files
                      )

                      print(f"Updated Gist: {updated['html_url']}")

                      with open(
                          os.environ["GITHUB_STEP_SUMMARY"], "a"
                      ) as summary:
                          summary.write(
                              "## Gist updated\n\n"
                              f"- **ID:** `{gist_id}`\n"
                              f"- **URL:** {updated['html_url']}\n"
                              f"- **Added:** {len(add_files)}\n"
                              f"- **Edited:** {len(edit_files)}\n"
                              f"- **Deleted:** {len(delete_files)}\n"
                          )

              # DELETE
              elif operation == "delete":
                  print(f"Deleting Gist {gist_id}...")

                  client.delete_gist(gist_id)

                  print("Gist successfully deleted.")

                  with open(
                      os.environ["GITHUB_STEP_SUMMARY"], "a"
                  ) as summary:
                      summary.write(
                          "## Gist deleted\n\n"
                          f"Gist `{gist_id}` was successfully deleted.\n"
                      )

              else:
                  raise SystemExit(
                      f"Unsupported operation: {operation}"
                  )

          except GitHubGistError as error:
              print(f"Gist API error: {error}", file=sys.stderr)
              raise SystemExit(1)

          PY
